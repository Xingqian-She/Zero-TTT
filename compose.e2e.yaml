services:
  control:
    ports: !reset []
    volumes:
      - e2e-control-state:/state/control
      - type: bind
        source: ./configs/acceptance
        target: /profiles
        read_only: true

  data-worker:
    volumes:
      - e2e-raw:/raw:ro
      - e2e-work:/work
      - e2e-data-artifacts:/artifacts/data
      - e2e-selfplay-artifacts:/artifacts/selfplay:ro
      - e2e-data-state:/state/data

  trainer-worker:
    volumes:
      - e2e-work:/work
      - e2e-data-artifacts:/artifacts/data:ro
      - e2e-model-artifacts:/artifacts/models

  selfplay-worker:
    volumes:
      - e2e-work:/work
      - e2e-model-artifacts:/artifacts/models:ro
      - e2e-selfplay-artifacts:/artifacts/selfplay

  tensorboard:
    ports: !reset []
    volumes:
      - e2e-model-artifacts:/artifacts/models:ro

  ui:
    ports: !reset []

  dev:
    volumes:
      - type: bind
        source: .
        target: /workspace
      - e2e-root:/datasets
      - e2e-raw:/datasets/raw
      - e2e-work:/datasets/work
      - e2e-data-artifacts:/datasets/artifacts/data
      - e2e-model-artifacts:/datasets/artifacts/models
      - e2e-selfplay-artifacts:/datasets/artifacts/selfplay
      - e2e-control-state:/datasets/state/control
      - e2e-data-state:/datasets/state/data

  e2e-driver:
    profiles: ["dev"]
    image: zero-ttt/dev:1.0.0
    working_dir: /workspace
    init: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
      - e2e-root:/datasets
      - e2e-raw:/datasets/raw
      - e2e-work:/datasets/work
      - e2e-data-artifacts:/datasets/artifacts/data:ro
      - e2e-model-artifacts:/datasets/artifacts/models:ro
      - e2e-selfplay-artifacts:/datasets/artifacts/selfplay:ro
    tmpfs:
      - /tmp
    command: ["python", "scripts/compose_e2e_test.py", "prepare", "/datasets"]

volumes:
  e2e-root:
  e2e-raw:
  e2e-work:
  e2e-data-artifacts:
  e2e-model-artifacts:
  e2e-selfplay-artifacts:
  e2e-control-state:
  e2e-data-state:
