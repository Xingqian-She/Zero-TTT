name: zero-ttt

services:
  control:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.cpu
      args:
        SERVICE: control
    image: zero-ttt/control:1.0.0
    init: true
    restart: unless-stopped
    environment:
      ZERO_TTT_CONTROL_DB: /state/control/control.sqlite
      ZERO_TTT_PROFILE_ROOT: /profiles
      ZERO_TTT_CONTROL_HOST: 0.0.0.0
      ZERO_TTT_CONTROL_PORT: "8090"
    volumes:
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/state/control
        target: /state/control
      - type: bind
        source: ./configs/profiles
        target: /profiles
        read_only: true
    command: ["zero-ttt-control"]
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  data-worker:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.cpu
      args:
        SERVICE: data
    image: zero-ttt/data:1.0.0
    init: true
    restart: unless-stopped
    stop_grace_period: 30m
    environment:
      ZERO_TTT_CONTROL_URL: http://control:8090
      ZERO_TTT_WORKER_ID: data-1
      ZERO_TTT_RAW_ROOT: /raw
      ZERO_TTT_DATA_WORK_ROOT: /work/data
      ZERO_TTT_ARTIFACT_ROOT: /artifacts
      ZERO_TTT_DATA_DB: /state/data/data.sqlite
    volumes:
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/raw
        target: /raw
        read_only: true
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/work
        target: /work
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/artifacts/data
        target: /artifacts/data
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/artifacts/selfplay
        target: /artifacts/selfplay
        read_only: true
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/state/data
        target: /state/data
    command: ["zero-ttt-data-worker"]
    depends_on:
      control:
        condition: service_healthy

  trainer-worker:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.trainer
    image: zero-ttt/trainer:1.0.0
    init: true
    restart: unless-stopped
    gpus: all
    shm_size: 8gb
    stop_grace_period: 30m
    environment:
      ZERO_TTT_CONTROL_URL: http://control:8090
      ZERO_TTT_WORKER_ID: trainer-1
      ZERO_TTT_ARTIFACT_ROOT: /artifacts
      ZERO_TTT_TRAINER_WORK_ROOT: /work/trainer
    volumes:
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/work
        target: /work
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/artifacts/data
        target: /artifacts/data
        read_only: true
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/artifacts/models
        target: /artifacts/models
    depends_on:
      control:
        condition: service_healthy

  selfplay-worker:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.selfplay
      target: selfplay
    image: zero-ttt/selfplay:1.0.0
    init: true
    restart: unless-stopped
    gpus: all
    shm_size: 8gb
    stop_grace_period: 30m
    environment:
      ZERO_TTT_CONTROL_URL: http://control:8090
      ZERO_TTT_WORKER_ID: selfplay-1
      ZERO_TTT_ARTIFACT_ROOT: /artifacts
      ZERO_TTT_SELFPLAY_WORK_ROOT: /work/selfplay
    volumes:
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/work
        target: /work
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/artifacts/models
        target: /artifacts/models
        read_only: true
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/artifacts/selfplay
        target: /artifacts/selfplay
    depends_on:
      control:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.cpu
      args:
        SERVICE: ui
    image: zero-ttt/ui:1.0.0
    init: true
    restart: unless-stopped
    environment:
      ZERO_TTT_CONTROL_URL: http://control:8090
      ZERO_TTT_TENSORBOARD_URL: http://127.0.0.1:6006
      ZERO_TTT_UI_HOST: 0.0.0.0
      ZERO_TTT_UI_PORT: "8080"
    command: ["zero-ttt-ui"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      control:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  tensorboard:
    build:
      context: .
      dockerfile: docker/services/Dockerfile.tensorboard
    image: zero-ttt/tensorboard:1.0.0
    init: true
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}/artifacts/models
        target: /artifacts/models
        read_only: true
    ports:
      - "127.0.0.1:6006:6006"

  dev:
    profiles: ["dev"]
    build: &dev-build
      context: .
      dockerfile: docker/services/Dockerfile.selfplay
      target: dev
    image: zero-ttt/dev:1.0.0
    working_dir: /workspace
    init: true
    gpus: all
    shm_size: 8gb
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ${ZERO_TTT_DATA_ROOT:-D:/datasets/Zero-TTT}
        target: /datasets
    command: ["/bin/bash"]

  test:
    profiles: ["dev"]
    build: *dev-build
    image: zero-ttt/dev:1.0.0
    working_dir: /workspace
    init: true
    network_mode: none
    shm_size: 8gb
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    tmpfs:
      - /tmp
    command: ["python", "-m", "pytest", "-q"]

  gpu-smoke:
    profiles: ["dev"]
    build: *dev-build
    image: zero-ttt/dev:1.0.0
    working_dir: /workspace
    init: true
    network_mode: none
    gpus: all
    shm_size: 8gb
    volumes:
      - type: bind
        source: .
        target: /workspace
        read_only: true
    tmpfs:
      - /tmp
    command: ["python", "scripts/docker_smoke_test.py"]
