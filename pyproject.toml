[project]
name = "zero-ttt-workspace"
version = "1.0.0"
description = "Single-host, service-oriented Go training workspace"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "httpx2>=2.12,<3",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
zero-ttt-contracts = { workspace = true }
zero-ttt-core = { workspace = true }
zero-ttt-dataset = { workspace = true }
zero-ttt-game = { workspace = true }
zero-ttt-model = { workspace = true }
zero-ttt-worker-runtime = { workspace = true }

[tool.uv.workspace]
members = [
  "packages/*",
  "services/*",
  "tools/admin-cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "C90"]
mccabe.max-complexity = 12

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages", "services", "tools/admin-cli"]
exclude = ["third_party"]
reportMissingTypeStubs = false
# Torch, NumPy and NiceGUI expose partially untyped runtime APIs. Keep strict
# checking for our own annotations and concrete incompatibilities without
# treating unknowns originating inside those libraries as application errors.
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnusedFunction = false
